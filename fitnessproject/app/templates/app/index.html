{% load static %}

<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=999">
    <title>Portfolio</title>
  </head>

  <body class="bg-white text-dark">
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
      <div class="container">
      </div>
    </nav>

    <main style="margin-top: -180px;">
      <div class="container">
        <div class="card border-0 shadow-none text-center">
          <div class="p-4 bg-white text-dark">
            <h2 class="title">作品No.1 フィットネスログ</h2>

            <div class="row g-3 text-center mt-4">

              <div class="col-12 col-md-4">
                <img src="{% static 'img/calendar.jpeg' %}"
                     alt="ホーム画面"
                     class="img-fluid" />
              </div>

              <div class="col-12 col-md-4">
                <img src="{% static 'img/schedule.jpeg' %}"
                     alt="予定作成"
                     class="img-fluid sub-img" />
              </div>

              <div class="col-12 col-md-4">
                <img src="{% static 'img/record.jpeg' %}"
                     alt="運動記録"
                     class="img-fluid sub-img" />
              </div>

            </div>

          </div>
        </div>
      </div>
    </main>

<p class="lead mb-2 text-center mx-auto text-block">
  フィットネスログは、<span class="sp-br"><br></span>
  健康維持に関心がある人のための<span class="sp-br"><br></span>
  運動履歴の記録、<span class="sp-br"><br></span>
  ToDo・スケジュール管理アプリです。<span class="sp-br"><br></span>
  このアプリを利用することで、<span class="sp-br"><br></span>
  日々の運動の目標・予定・履歴を<span class="sp-br"><br></span>
  視認することができ、<span class="sp-br"><br></span>
  運動を継続するサポートをします。
</p>

<style>
  .text-block {
    max-width: 560px;
    line-height: 1.7;
  }

  .sp-br {
    display: none !important;
  }

  @media (max-width: 768px) {
    .text-block {
      max-width: 90%;
    }
    .sp-br {
      display: inline !important;
    }
  }
</style>

    <div class="container text-center fs-5">
      <a href="{% static 'pdf/企画書.pdf' %}" target="_blank">企画書</a>
      <a href="{% static 'pdf/画面設計図.pdf' %}" target="_blank"> 画面設計図</a>
      <a href="{% static 'svg/画面遷移図.drawio.svg' %}" target="_blank"> 画面遷移図</a>
      <a href="{% static 'svg/ER図.drawio.svg' %}" target="_blank"> ER図</a>

      <div class="mt-4">
        <a href="{% url 'app:user_login' %}?next=/home" class="btn btn-warning w-30 text-white">
          フィットネスログアプリへ
        </a>
      </div>
    </div>

    {% block extra_js %} {% endblock %}
  </body>
</html>
